AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Q Business App with Q Index for Countries Data'

Parameters:
  Environment:
    Type: String
    Description: Environment name (e.g., dev, prod)
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  
  BucketNamePrefix:
    Type: String
    Description: Prefix for the S3 bucket name
    Default: qindex-countries
  
  ApplicationNamePrefix:
    Type: String
    Description: Prefix for the Q Business application name
    Default: CountriesKB
  
  DataSourcePrefix:
    Type: String
    Description: Prefix for the data source name
    Default: Countries
  
  RetrieverPrefix:
    Type: String
    Description: Prefix for the Q Index retriever name
    Default: Countries

Resources:
  # IAM Role for Q Business
  QBusinessServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: qbusiness.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonQFullAccess

  # Customer-managed policy instead of an inline role policy
  QBusinessS3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Read-only access for Q Business to the countries data bucket
      Roles:
        - !Ref QBusinessServiceRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt CountriesDataBucket.Arn
              - !Sub ${CountriesDataBucket.Arn}/*

  # Destination for server access logs
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Access-log destination bucket; logging it to itself would recurse
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
    Properties:
      BucketName: !Sub ${BucketNamePrefix}-logs-${Environment}-${AWS::Region}-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAccessLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub ${AccessLogsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowS3ServerAccessLogDelivery
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${AccessLogsBucket.Arn}/access-logs/*
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  # S3 Bucket for Countries Data
  CountriesDataBucket:
    Type: AWS::S3::Bucket
    Metadata:
      guard:
        SuppressedRules:
          # Object Lock is irreversible and blocks sample cleanup; versioning is on
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
    Properties:
      BucketName: !Sub ${BucketNamePrefix}-${Environment}-${AWS::Region}-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: access-logs/
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # S3 Bucket Policy
  CountriesDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CountriesDataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt CountriesDataBucket.Arn
              - !Sub ${CountriesDataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowQBusinessRead
            Effect: Allow
            Principal:
              AWS: !GetAtt QBusinessServiceRole.Arn
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::${CountriesDataBucket}
              - !Sub arn:aws:s3:::${CountriesDataBucket}/*

Outputs:
  BucketName:
    Description: Name of the S3 bucket containing countries data
    Value: !Ref CountriesDataBucket
    Export:
      Name: !Sub ${AWS::StackName}-BucketName
  
  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt CountriesDataBucket.Arn
    Export:
      Name: !Sub ${AWS::StackName}-BucketArn
  
  QBusinessServiceRoleArn:
    Description: ARN of the Q Business service role
    Value: !GetAtt QBusinessServiceRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-QBusinessServiceRoleArn
