server { listen 80; root /usr/share/nginx/html; index index.html;
  location /api/ { proxy_pass http://localhost:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_buffering off; proxy_cache off; proxy_set_header Connection ''; }
  location / { try_files $uri $uri/ /index.html; }
}
