[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-agent"
version = "0.1.0"
description = "SQL Agent with Planner/Executor pattern for AWS AgentCore"
authors = [{name = "Developer", email = "dev@example.com"}]
requires-python = ">=3.11"
# Keep in sync with requirements.txt (used by the Dockerfile). streamlit and
# requests are only needed for the local UI and test_agentcore.py.
dependencies = [
    "bedrock-agentcore[strands-agents]==1.25.4",
    "strands-agents==1.66.0",
    "boto3==1.43.117",
    "asyncpg==0.32.0",
    "opensearch-py==3.2.0",
    "pydantic==2.14.4",
    "pyiceberg[s3fs,duckdb]==0.12.0",
    "getdaft==0.5.0",
    "streamlit==1.67.0",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"